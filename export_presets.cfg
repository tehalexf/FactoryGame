; DEEP FOUNDRY — export presets.
;
; **Committed on purpose.** Godot's project template gitignores this file, on the
; assumption that a preset is a developer's private thing. Here it is the opposite:
; it is the build, it carries the one filter that decides whether a tester gets the
; real game or a degraded one, and `tools/release/build_windows.sh` cannot run
; without it. See docs/RELEASING.md.
;
; ── The include_filter line is the whole ticket ───────────────────────────────
;
; Three asset classes are loaded at runtime from `res://assets_licensed/generated/`
; — weapon viewmodels, audio cues, set-dressing props (docs/ASSET_PIPELINE.md §7-9).
; They are non-redistributable purchases, so they are gitignored and carry a
; `.gdignore` that keeps Godot's importer out of the tree. An un-imported file is
; not a resource, so `export_filter="all_resources"` does not see it, and
; **`include_filter` is the only thing that puts it in the PCK.**
;
; Every one of those three has a graceful fallback, so an export that dropped them
; produces a build that runs, looks worse, sounds worse and says nothing. That is
; the failure mode `tools/release/preflight.py` and `tools/release/verify_pck.py`
; exist to make impossible. Do not touch this line without reading both.
;
; Bundling them *inside the PCK* is what the licences permit: use in a shipped
; game, yes; redistribution as assets, no. Hence `embed_pck=false` is wrong for us
; and `binary_format/embed_pck=true` is right — one .exe, nothing loose beside it
; for anyone to extract.
;
; `content/*` is on the same line for the same reason and it is not a luxury: the
; definitions are read with `FileAccess`, `content/.gdignore` keeps the importer
; from claiming every `.csv` as a translation table, and the first export of this
; project therefore shipped **no Machines, no Recipes and no tuning at all**. A
; `.toml` is not a resource by any extension Godot knows, so even with the staging
; tree's `keep` sidecars it reaches the pack only through this filter.
;
; Neither line works on its own, and `tools/release/stage.py` is the other half:
; a `.gdignore` hides a directory from the exporter exactly as thoroughly as from
; the importer, so the build exports a staging tree in which those markers have
; been replaced by per-file `importer="keep"` sidecars. Read that file before
; changing anything here.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets_licensed/generated/*, content/*"
exclude_filter="assets/*/intake/*, tests/*, tools/aigen/*, tools/assets/*, tools/balance/*, tools/tuning/*, tools/visual/*, tools/git/*, docs/*, *.md"
export_path="build/windows/DeepFoundry.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
; 2 = "Debug and Release". A Windows GUI-subsystem binary does not attach to the
; console it was launched from, so without this wrapper a release build run with
; `--headless` prints nowhere — and `tools/release/build_windows.sh` verifies the
; build by running it headless and reading what it says. It is also what a tester
; can run to get a log when something goes wrong.
debug/export_console_wrapper=2
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name=""
application/product_name=""
application/file_description=""
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true
ssh_remote_deploy/enabled=false
